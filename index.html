<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra-Sim 4K Sewing Engine</title>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        .control-panel { pointer-events: auto; background: rgba(20, 20, 20, 0.85); padding: 20px; border-radius: 8px; border: 1px solid #333; backdrop-filter: blur(10px); }
        h1 { margin: 0 0 10px 0; font-size: 1.5rem; letter-spacing: 1px; color: #00ffcc; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-right: 5px; transition: 0.2s; }
        button:hover { background: #00ccaa; }
        .telemetry { margin-top: 15px; font-family: monospace; font-size: 0.85rem; color: #aaa; }
    </style>
    <!-- Core External Graphics Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="control-panel">
            <h1>SINGER 3337 ENGINE</h1>
            <p>Modular Mechanical State Layer</p>
            <button id="btn-power">TOGGLE POWER</button>
            <button id="btn-pedal">PRESS FOOT PEDAL</button>
            
            <div class="telemetry">
                <div>Machine Status: <span id="status-power">OFF</span></div>
                <div>Needle Velocity: <span id="status-rpm">0 RPM</span></div>
                <div>Engine Rate: <span id="status-fps">--</span> FPS</div>
            </div>
        </div>
    </div>

    <!-- Kickstart application natively as a module -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
